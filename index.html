*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding:56px 0 24px}
h1{margin:0 0 8px;font-size:2.2rem}

.tools{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 16px}

input{flex:1;min-width:200px}
.count{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:48px}
.card{display:flex;flex-direction:column;gap:10px;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card h2{margin:0;font-size:1.05rem;word-break:break-word}
.card p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.chip{background:var(--chip);color:var(--accent);padding:2px 8px;border-radius:999px}
.arch{opacity:.65}
footer{border-top:1px solid var(--border);padding:24px 0;color:var(--muted);font-size:.85rem}

const EXCLUDE=new Set(["georgemyller.github.io","GeorgeMyller"]);
let repos=[];
const $=id=>document.getElementById(id);
function norm(list){return list.filter(r=>!r.fork&&!EXCLUDE.has(r.name)).sort((a,b)=>new Date(b.pushed_at)-new Date(a.pushed_at))}
function render(){
  const q=$("q").value.toLowerCase(),l=$("lang").value;
  const list=repos.filter(r=>(!l||r.language===l)&&(r.name+" "+(r.description||"")).toLowerCase().includes(q));
  $("count").textContent=list.length+" projeto(s)";
  $("grid").replaceChildren(...list.map(r=>{
    const a=document.createElement("a");a.className="card"+(r.archived||(r.description||"").startsWith("[Arquivado")?" arch":"");
    a.href=r.html_url;a.target="_blank";a.rel="noopener";
    const h=document.createElement("h2");h.textContent=r.name;
    const p=document.createElement("p");p.textContent=r.description||"Sem descrição.";
    const m=document.createElement("div");m.className="meta";
    if(r.language){const c=document.createElement("span");c.className="chip";c.textContent=r.language;m.append(c)}
    if(r.stars){const s=document.createElement("span");s.textContent="★ "+r.stars;m.append(s)}
    const d=document.createElement("span");d.textContent="Atualizado em "+new Date(r.pushed_at).toLocaleDateString("pt-BR");m.append(d);
    a.append(h,p,m);return a}));
}
function setup(list){
  repos=norm(list);
  const langs=[...new Set(repos.map(r=>r.language).filter(Boolean))].sort();
  const cur=$("lang").value;
  $("lang").replaceChildren(new Option("Todas as linguagens",""),...langs.map(x=>new Option(x,x)));
  $("lang").value=langs.includes(cur)?cur:"";
  render();
}
$("q").addEventListener("input",render);$("lang").addEventListener("change",render);
setup(SNAPSHOT);
fetch("https://api.github.com/users/GeorgeMyller/repos?per_page=100&type=owner")
 .then(r=>r.ok?r.json():Promise.reject())
 .then(j=>setup(j.map(r=>({name:r.name,description:r.description,html_url:r.html_url,language:r.language,stars:r.stargazers_count,fork:r.fork,archived:r.archived,pushed_at:r.pushed_at}))))
 .catch(()=>{});
</script>
