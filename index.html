  return html`<section ref=${ref} class=${"band reveal"+(on?" in":"")}>
    <img src=${IMGS[1]} alt="Iguana diante de monitores" loading="lazy"/>
    <div><h3>Código, dados e agentes</h3><p>Construo ferramentas que automatizam o trabalho repetitivo e dão clareza aos números.</p></div>
  </section>`;
}
function Stat({value,label}){const n=useCount(value);return html`<div class="stat"><b>${n}</b><span>${label}</span></div>`}

function FCard({r,i}){
  const [ref,on]=useReveal();
  const move=e=>{
    const el=e.currentTarget,b=el.getBoundingClientRect();
    const x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;
    el.style.setProperty("--mx",x*100+"%");el.style.setProperty("--my",y*100+"%");
    el.style.transform=`perspective(800px) rotateX(${(.5-y)*8}deg) rotateY(${(x-.5)*8}deg) translateY(-4px)`;
  };
  const leave=e=>{e.currentTarget.style.transform=""};
  return html`<a ref=${ref} class=${"fcard reveal"+(on?" in":"")} style=${{"--d":i*90+"ms"}} href=${r.html_url} target="_blank" rel="noopener" onMouseMove=${move} onMouseLeave=${leave}>
    <div class="cover"><img src=${IMGS[i%3]} alt="" loading="lazy"/></div>
    <h2><span>${r.name}</span><span class="arrow">↗</span></h2>
    <p>${r.description||"Sem descrição."}</p>
    <div class="meta">${r.language&&html`<span class="chip">${r.language}</span>`}${r.stars>0&&html`<span class="chip star">★ ${r.stars}</span>`}</div>
  </a>`;
}
function Card({r,i}){
  const arch=r.archived||(r.description||"").startsWith("[Arquivado");
  return html`<a class=${"card pop"+(arch?" arch":"")} style=${{"--d":Math.min(i,12)*35+"ms"}} href=${r.html_url} target="_blank" rel="noopener">
    <h2>${r.name}</h2><p>${r.description||"Sem descrição."}</p>
    <div class="meta">${r.language&&html`<span class="chip">${r.language}</span>`}<span>Atualizado em ${new Date(r.pushed_at).toLocaleDateString("pt-BR")}</span></div>
  </a>`;
}
function App(){
  const [repos,setRepos]=useState(()=>normalize(SNAPSHOT));
  const [q,setQ]=useState("");const [lang,setLang]=useState("");
  useEffect(()=>{
    fetch("https://api.github.com/users/GeorgeMyller/repos?per_page=100&type=owner").then(r=>r.ok?r.json():Promise.reject())
    .then(j=>setRepos(normalize(j.map(r=>({name:r.name,description:r.description,html_url:r.html_url,language:r.language,stars:r.stargazers_count,fork:r.fork,archived:r.archived,pushed_at:r.pushed_at})))))
    .catch(()=>{});
  },[]);
  const langs=useMemo(()=>[...new Set(repos.map(r=>r.language).filter(Boolean))].sort(),[repos]);
  const featured=FEATURED.map(n=>repos.find(r=>r.name===n)).filter(Boolean);
  const list=repos.filter(r=>(!lang||r.language===lang)&&(r.name+" "+(r.description||"")).toLowerCase().includes(q.toLowerCase()));
  return html`<div class="wrap">
    <header>
      <div>
      <h1>Olá, eu sou <span class="grad">George Myller</span></h1>
      <${Typing} text="Agentes de IA, automação, análise de dados e ferramentas open source."/>
      <div class="stats"><${Stat} value=${repos.length} label="projetos públicos"/><${Stat} value=${langs.length} label="linguagens"/><${Stat} value=${repos.reduce((s,r)=>s+(r.stars||0),0)} label="estrelas"/></div>
      </div>
      <${Hero}/>
    </header>
    <h3 class="sec">Destaques</h3>
    <section class="featured">${featured.map((r,i)=>html`<${FCard} key=${r.name} r=${r} i=${i}/>`)}</section>
    <${Band}/>
    <h3 class="sec">Todos os projetos</h3>
    <div class="tools">
      <input type="search" placeholder="Buscar projeto…" aria-label="Buscar projeto" value=${q} onInput=${e=>setQ(e.target.value)}/>
      <select aria-label="Filtrar por linguagem" value=${lang} onChange=${e=>setLang(e.target.value)}>
        <option value="">Todas as linguagens</option>${langs.map(l=>html`<option key=${l} value=${l}>${l}</option>`)}
      </select>
    </div>
    <div class="count">${list.length} projeto(s)</div>
    <main class="grid">${list.map((r,i)=>html`<${Card} key=${r.name+q+lang} r=${r} i=${i}/>`)}</main>
    <footer>Dados da API pública do GitHub · <a href="https://github.com/GeorgeMyller">github.com/GeorgeMyller</a></footer>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
